<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Perf Lab — e2e</title>
<meta name="theme-color" content="#191917">
<link rel="stylesheet" href="../app.css">
<!-- Harnais e2e : charge la vraie app et déroule le parcours complet.
     Lancer :  python3 tools/serve.py 8741  (racine du repo) puis
     chrome --headless=new --virtual-time-budget=30000 --dump-dom "http://localhost:8741/tests/e2e.html"
     → chaque ligne de #results commence par E2E-PASS ou E2E-FAIL. -->
</head>
<body>
<div id="app"></div>
<pre id="results"></pre>

<script>
  // état vierge + pré-seed d'anciennes clés mono-profil pour tester la migration
  localStorage.clear();
  localStorage.setItem("perflab.programs", JSON.stringify([
    { id:"legacy-prog", title:"LEGACY", sessions:[{ id:"s1", blocks:[] }] }
  ]));
  localStorage.setItem("perflab.weeks", JSON.stringify({ "legacy-prog": 2 }));
  // espace Souad pollué par un seed antérieur aux assignations : upper doit en être retiré
  localStorage.setItem("perflab.p.souad.programs", JSON.stringify([
    { id:"upper", title:"UPPER", sessions:[{ id:"s1", blocks:[] }] },
    { id:"prehaltero", title:"PRÉ", sessions:[{ id:"s1", blocks:[] }] }
  ]));
  window.confirm = () => true; // pas de dialogues bloquants en headless
</script>
<script src="../config.js"></script>
<script>
  // le harnais reste en LOCAL : config.js porte la vraie clé publique de la Programmation
  window.CONFIG.CYCLE_SUPABASE_URL = ""; window.CONFIG.CYCLE_SUPABASE_ANON_KEY = "";
</script>
<script src="../programs.js"></script>
<script src="../progression.js"></script>
<script src="../cycle.js"></script>
<script src="../backend.js"></script>
<script src="../cyclestore.js"></script>
<script src="fixtures/cycle-sample.js"></script>
<script src="../cycle-ui.js"></script>
<script src="../app.js"></script>

<script>
(async () => {
  const out = [];
  const ok = (name, cond) => out.push((cond ? "E2E-PASS " : "E2E-FAIL ") + name);
  const tick = (ms = 60) => new Promise(r => setTimeout(r, ms));
  const goto = async h => { location.hash = h; await tick(); };
  const lum = c => .2126 * ch(c, 0) + .7152 * ch(c, 1) + .0722 * ch(c, 2);
  const ch = (c, i) => { const v = +c.match(/[\d.]+/g)[i] / 255; return v <= .04045 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4; };
  const ratio = (a, b) => { const x = lum(a), y = lum(b); return (Math.max(x, y) + .05) / (Math.min(x, y) + .05); };
  const EMOJI = /[\u{1F4BE}\u{1F4F6}\u{1F3AF}\u{26A1}\u{1F389}]/u;   // 💾 📶 🎯 ⚡ 🎉

  const wl = { n: 0, released: 0, request(){ wl.n++; const s = new EventTarget();
    s.release = async () => { wl.released++; s.dispatchEvent(new Event("release")); }; return Promise.resolve(s); } };
  Object.defineProperty(navigator, "wakeLock", { value: wl, configurable: true });

  try {
    await tick(300); // boot()

    /* 1. bibliothèque : programmes par défaut + programme legacy migré + sélecteur */
    ok("bibliothèque rendue (4 défauts Moss + legacy)", document.querySelectorAll(".card[data-go]").length === 5);
    ok("HYROX LAB présent chez Moss", !!document.querySelector('[data-go="hyrox"]'));
    ok("Pré Haltéro absent chez Moss", !document.querySelector('[data-go="prehaltero"]'));
    ok("LOWER LAB présent", !!document.querySelector('[data-go="lower"]'));
    ok("programme legacy migré vers Moss", !!document.querySelector('[data-go="legacy-prog"]'));
    ok("clé legacy supprimée", localStorage.getItem("perflab.programs") === null);
    ok("semaine legacy migrée", Backend.getWeek("legacy-prog") === 2);
    ok("sélecteur profils Moss/Souad", document.querySelectorAll(".profbtn").length === 2);
    ok("cartes de la bibliothèque : de vrais liens",
       [...document.querySelectorAll(".card[data-go]")].every(c => c.tagName === "A" && c.getAttribute("href") === "#/p/" + c.dataset.go)
       && document.querySelector("[data-add]").tagName === "A");
    ok("profil actif annoncé (aria-pressed)", document.querySelector(".profbtn.active").getAttribute("aria-pressed") === "true"
       && document.querySelector(".profbtn:not(.active)").getAttribute("aria-pressed") === "false");
    ok("bibliothèque sans emoji", !EMOJI.test(document.getElementById("app").innerHTML));
    /* DA Sumi, lot 3 : un seul accent, titres en casse normale, listes sans panneau */
    const topOf3 = q => document.querySelector(q).getBoundingClientRect().top;
    ok("accueil : titres en casse normale", document.querySelector("h1").textContent.trim() === "Perf Lab"
       && [...document.querySelectorAll(".card .ct")].every(e => e.textContent !== e.textContent.toUpperCase()));
    ok("accueil : cartes sans couleur propre ni panneau", [...document.querySelectorAll(".card")].every(c => !c.style.getPropertyValue("--c-accent"))
       && getComputedStyle(document.querySelector(".card[data-go]")).backgroundColor === "rgba(0, 0, 0, 0)");
    ok("casse : sigles et lettres seules gardés", dcase("BLOC A — EVERY 2′ × 6") === "Bloc A — every 2′ × 6" && dcase("EMOM 12 MIN") === "EMOM 12 min"
       && dcase("ANTI-EXTENSION") === "Anti-extension" && dcase("Force verticale") === "Force verticale" && dcase("~15 MIN") === "~15 min");
    const oneMain = () => document.querySelectorAll("main").length === 1 && !document.querySelector("header main");
    ok("accueil : une zone principale <main> (Lighthouse)", oneMain() && !!document.querySelector("main .lib"));
    toast("test");
    ok("toast lu par le lecteur d'écran", document.getElementById("toast").getAttribute("role") === "status");
    const idx = await (await fetch("../index.html", { cache: "no-store" })).text();
    ok("zoom autorisé (plus de user-scalable=no ni maximum-scale)", !/user-scalable\s*=\s*no|maximum-scale/.test(idx));
    ok("profil actif par défaut : Moss", Backend.activeProfile() === "moss");
    /* mode clair : interrupteur sur l'accueil, réglage de l'appareil (hors des données des profils) */
    const sw = () => document.getElementById("theme"), bodyBg = () => getComputedStyle(document.body).backgroundColor;
    const rootBg = () => getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();
    ok("mode clair : interrupteur sur l'accueil, éteint par défaut", !!sw() && sw().getAttribute("role") === "switch"
       && sw().getAttribute("aria-checked") === "false" && /Mode clair/.test(sw().textContent) && lum(bodyBg()) < .05);
    ok("mode clair : interrupteur assez grand pour le pouce (44 px)", sw().getBoundingClientRect().height >= 44);
    sw().click(); await tick();
    ok("mode clair : fond papier, texte encre lisible", document.documentElement.dataset.theme === "light" && lum(bodyBg()) > .8
       && ratio(getComputedStyle(document.body).color, bodyBg()) >= 4.5);
    ok("mode clair : retenu sur l'appareil et après un nouveau rendu", localStorage.getItem("perflab.theme") === "light"
       && (renderLibrary(), sw().getAttribute("aria-checked") === "true"));
    ok("mode clair : couleur de barre du navigateur suivie", document.querySelector('meta[name="theme-color"]').content === rootBg());
    const head = idx.split("</head>")[0];
    ok("mode clair : posé avant le premier rendu (index.html, avant app.css), barre iOS claire",
       head.includes("perflab.theme") && head.indexOf("perflab.theme") < head.indexOf('href="app.css"') && head.includes('"' + rootBg() + '"') && /"default"/.test(head));
    ok("mode clair : bande d'encre sous l'heure si iOS garde la barre translucide",
       getComputedStyle(document.body, "::before").backgroundColor === getComputedStyle(document.body).color);
    ok("mode clair : hors de la sauvegarde des profils", !/theme/.test(JSON.stringify(Backend.exportAll())));
    sw().click(); await tick();
    ok("mode sombre rétabli", !document.documentElement.dataset.theme && localStorage.getItem("perflab.theme") === null
       && lum(bodyBg()) < .05 && document.querySelector('meta[name="theme-color"]').content === rootBg());

    /* 2. bascule Souad : bibliothèque indépendante */
    document.querySelector('[data-prof="souad"]').click();
    await tick(200);
    ok("Souad actif après clic", Backend.activeProfile() === "souad");
    ok("Souad : Pull-Up Lab + Pré Haltéro uniquement",
       document.querySelectorAll(".card[data-go]").length === 2 &&
       !!document.querySelector('[data-go="pullup"]') &&
       !!document.querySelector('[data-go="prehaltero"]') &&
       !document.querySelector('[data-go="legacy-prog"]'));
    ok("migration : upper (seed pré-assignation) retiré de chez Souad",
       !document.querySelector('[data-go="upper"]'));

    /* 2b. programme Pull-Up Lab : paliers + RPE fonctionnels chez Souad */
    await goto("p/pullup");
    ok("Pull-Up Lab : 4 séances (dont TEST)", document.querySelectorAll(".tab").length === 4);
    ok("Pull-Up Lab : paliers affichés", document.querySelectorAll(".target.tier").length >= 3);
    ok("programme : retour, titre puis repère", topOf3(".back") < topOf3("h1") && topOf3("h1") < topOf3(".kicker"));
    ok("programme : titre, onglets et séance en casse normale", ["h1", ".tab .t", ".shead h2"].every(q => { const t = document.querySelector(q).textContent; return t !== t.toUpperCase(); }));
    ok("programme : nom du bloc à la verticale", getComputedStyle(document.querySelector(".blk-h .bl")).writingMode === "vertical-rl");
    document.querySelectorAll(".tab")[1].click(); await tick();
    ok("programme : un seul accent (l'or), quelle que soit la couleur du programme ou de la séance",
       document.documentElement.style.getPropertyValue("--accent") === "var(--lib-accent)" && !document.querySelector(".tdot"));
    document.querySelectorAll(".tab")[0].click(); await tick();
    ok("plus aucun bouton Timer/EMOM", !document.querySelector("[data-settimer]") && !document.querySelector("[data-setemom]"));
    /* jalon : séance TEST, saisie d'un résultat */
    document.querySelectorAll(".tab")[3].click(); await tick();
    const tin = document.querySelector('.tin[data-tt="testpu"]');
    ok("séance TEST : saisie jalon présente", !!tin);
    tin.value = "1"; tin.dispatchEvent(new Event("change")); await tick();
    const tests = (Backend.loadProgression().pullup || {}).testpu;
    ok("jalon enregistré avec date", tests && tests.tests.length === 1 && tests.tests[0].reps === 1);
    /* séance faite → journal */
    ok("bouton séance faite présent", !!document.getElementById("sdone"));
    document.getElementById("sdone").click(); await tick(100);
    ok("séance journalisée", Backend.getLog().some(e => e.prog === "pullup" && e.s === "s4"));
    ok("bouton passé à l'état enregistré", document.getElementById("sdone").disabled);
    await goto("");
    ok("assiduité : 1 jour allumé chez Souad", document.querySelectorAll(".aday.on").length === 1);

    /* 3. import ancien format pendant que Souad est actif → rattaché à Moss, silencieusement */
    await goto("add");
    ok("Ajouter : une zone principale <main>", oneMain());
    ok("JSON à coller : 16 px et étiqueté", parseFloat(getComputedStyle(document.getElementById("jsonin")).fontSize) >= 16
       && !!document.getElementById("jsonin").getAttribute("aria-label"));
    document.getElementById("jsonin").value = JSON.stringify(
      { id:"import-test", title:"IMPORT", sessions:[{ id:"s1", blocks:[] }] });
    document.getElementById("import").click();
    await tick(200);
    const mossProgs = JSON.parse(localStorage.getItem("perflab.p.moss.programs") || "[]");
    const souadProgs = JSON.parse(localStorage.getItem("perflab.p.souad.programs") || "[]");
    ok("ancien format → profil Moss", mossProgs.some(p => p.id === "import-test"));
    ok("ancien format ∉ Souad", !souadProgs.some(p => p.id === "import-test"));

    /* 4. import format profiles v2 */
    await goto("add");
    document.getElementById("jsonin").value = JSON.stringify({
      schema:"perflab-profiles-v1",
      profiles:[{ id:"souad", programs:[{ id:"souad-prog", title:"SP", sessions:[{ id:"s1", blocks:[] }] }] }]
    });
    document.getElementById("import").click();
    await tick(200);
    ok("format profiles importé chez Souad",
       JSON.parse(localStorage.getItem("perflab.p.souad.programs") || "[]").some(p => p.id === "souad-prog"));

    /* 5. LOWER LAB (profil Moss) : paliers + RPE + douleur */
    document.querySelector('[data-prof="moss"]').click();
    await tick(200);
    const wlN = wl.n, wlR = wl.released;
    await goto("p/lower");
    ok("J1/J2 en onglets", document.querySelectorAll(".tab").length === 2);
    const wrap = document.querySelector(".wrap"); wrap.style.maxWidth = "390px";   // largeur iPhone
    const backLines = document.createRange(); backLines.selectNodeContents(document.querySelector(".back"));
    ok("bouton retour sur une seule ligne (390 px)", backLines.getClientRects().length === 1);
    wrap.style.maxWidth = "";
    ok("écran gardé allumé en séance (Wake Lock)", wl.n === wlN + 1);
    const h44 = sel => { const el = document.querySelector(sel); return !!el && el.getBoundingClientRect().height >= 44; };
    ok("série, charge, RPE et douleur : 44 px au moins",
       h44('.setbtn[data-k="rdl"]') && h44('.load[data-lk="rdl"]') && h44('.rpe-b[data-rk="rdl"]') && h44('.painbtn[data-pk="rdl"]'));
    ok("charge saisie en 16 px (pas de zoom iOS au focus)", parseFloat(getComputedStyle(document.querySelector(".load")).fontSize) >= 16);
    const exTop = document.querySelector("[data-ex] .ex-top");
    ok("en-tête d'exercice : un bouton replié", exTop.tagName === "BUTTON" && exTop.getAttribute("aria-expanded") === "false");
    exTop.click(); await tick();
    ok("en-tête d'exercice : déplié annoncé", exTop.getAttribute("aria-expanded") === "true" && exTop.closest("[data-ex]").classList.contains("open"));
    const ld = document.querySelector('.load[data-lk="rdl"]');
    ok("charge : champ étiqueté", /Charge série 1/.test(ld.getAttribute("aria-label") || ""));
    ok("bord des champs : contraste ≥ 3:1 (WCAG 1.4.11)", ratio(getComputedStyle(ld).borderTopColor, getComputedStyle(ld.closest(".ex")).backgroundColor) >= 3);
    ok("semaine : boutons étiquetés", document.getElementById("wup").getAttribute("aria-label") === "Semaine suivante"
       && document.getElementById("wdown").getAttribute("aria-label") === "Semaine précédente");
    ok("Animer, Vidéo et Réinitialiser : 44 px", h44(".gbtn") && h44("#reset"));
    ok("séance de bibliothèque sans emoji", !EMOJI.test(document.getElementById("main").innerHTML));
    const wbtn = document.getElementById("wup"), wr = wbtn.getBoundingClientRect();
    ok("stepper semaine : zone de tap élargie à 44 px", document.elementFromPoint(wr.left + wr.width / 2, wr.top - 5) === wbtn
       && document.elementFromPoint(wr.left + wr.width / 2, wr.bottom + 5) === wbtn);
    const tierBadges = document.querySelectorAll(".target.tier");
    ok("paliers affichés sur J1", tierBadges.length >= 5);
    ok("palier RDL initial 60 kg", tierBadges[0] && tierBadges[0].textContent.includes("60 kg"));
    const rpeB = v => document.querySelector(`.rpe-b[data-rk="rdl"][data-v="${v}"]`);
    ok("RPE au toucher : 11 valeurs de 0 à 10", document.querySelectorAll('.rpe-b[data-rk="rdl"]').length === 11 && !!rpeB(0) && !!rpeB(10));
    // repos inline : après la 1re série cochée il apparaît, après la dernière il s'arrête
    const rdlBtns = [...document.querySelectorAll('.setbtn[data-k="rdl"]')];
    rdlBtns[0].click(); await tick();
    const restEl = rdlBtns[0].closest("[data-ex]").querySelector("[data-rest]");
    ok("repos inline affiché après une série", !restEl.hidden && restEl.textContent.includes("REPOS"));
    ok("repos : un bouton", restEl.tagName === "BUTTON");
    ok("série cochée annoncée (aria-pressed)", rdlBtns[0].getAttribute("aria-pressed") === "true" && rdlBtns[1].getAttribute("aria-pressed") === "false");
    // écran verrouillé : les intervalles ralentissent, le repos doit suivre l'heure réelle
    const realNow = Date.now; Date.now = () => realNow() + 10 * 60e3; await tick(400); Date.now = realNow;
    ok("repos calé sur l'heure réelle : fini après 10 min d'écran verrouillé", restEl.hidden);
    // toutes les séries du RDL + RPE 5 → doit proposer le palier supérieur (70 kg)
    rdlBtns.slice(1).forEach(b => b.click()); await tick();
    ok("repos masqué après la dernière série", restEl.hidden);
    rpeB(5).click(); await tick();
    ok("RPE 5 sélectionné", rpeB(5).getAttribute("aria-pressed") === "true" && rpeB(4).getAttribute("aria-pressed") === "false");
    const next = document.querySelector('[data-nk="rdl"]');
    ok("RPE 5 + séries faites → propose 70 kg", next.textContent.includes("70 kg"));
    // douleur → retour au palier précédent (50 kg)
    document.querySelector('.painbtn[data-pk="rdl"]').click();
    await tick();
    ok("douleur annoncée (aria-pressed)", document.querySelector('.painbtn[data-pk="rdl"]').getAttribute("aria-pressed") === "true");
    ok("douleur → retour à 50 kg", next.textContent.includes("50 kg"));
    // état persistant
    const prog = Backend.loadProgression();
    ok("progression persistée (hist)", prog.lower && prog.lower.rdl && prog.lower.rdl.hist.length === 1);
    // semaine suivante : palier appliqué
    document.getElementById("wup").click();
    await tick();
    ok("semaine 2 : palier 50 kg appliqué",
       document.querySelector(".target.tier").textContent.includes("50 kg"));
    /* 2e évaluation en S2 → sparkline au re-rendu */
    document.querySelectorAll('.setbtn[data-k="rdl"]').forEach(b => b.click());
    rpeB(7).click(); await tick();
    const rdlSid = rpeB(7).dataset.rs, rpeNow = () => PROGRESS.lower["w" + Backend.getWeek("lower")][rdlSid].rdl.rpe;
    ok("RPE 7 enregistré (même entier qu'avant)", rpeNow() === 7);
    rpeB(7).click(); await tick();
    ok("retoucher la valeur l'efface", rpeNow() === null && rpeB(7).getAttribute("aria-pressed") === "false");
    rpeB(7).click(); await tick();
    document.getElementById("wdown").click(); await tick();
    document.getElementById("wup").click(); await tick();
    ok("sparkline visible après 2 évaluations", !!document.querySelector(".spark"));

    /* 6. Moss : bibliothèque complète ; isolation de la progression */
    await goto("");
    ok("Wake Lock relâché hors séance", wl.released === wlR + 1);
    ok("Moss : bibliothèque avec legacy + import",
       !!document.querySelector('[data-go="legacy-prog"]') && !!document.querySelector('[data-go="import-test"]'));
    ok("rappel de sauvegarde signalé (jamais exporté, données présentes)",
       !!document.querySelector(".backup.warn"));
    document.querySelector('[data-prof="souad"]').click();
    await tick(200);
    ok("progression Moss (lower) invisible chez Souad", !("lower" in Backend.loadProgression()));
    ok("pas de carte Programmation chez Souad", !document.querySelector("[data-cf]"));

    /* 7. retour chez Moss : bibliothèque intacte, micro-programme retiré */
    document.querySelector('[data-prof="moss"]').click();
    await tick(200);
    ok("les programmes de Moss sont toujours là (carte Programmation non comptée)",
       document.querySelectorAll(".card[data-go]").length === 6); // 4 défauts + legacy + import-test
    await goto("micro");
    ok("route micro retirée → bibliothèque", !!document.querySelector(".lib") && !document.querySelector("[data-micro]"));

    /* 7b. les programmes classiques fonctionnent toujours */
    await goto("p/lower");
    ok("LOWER LAB toujours fonctionnel",
       document.querySelectorAll(".tab").length === 2 && !!document.querySelector(".target.tier"));

    /* 8. PROGRAMMATION (Moss) : carte, semaine, rattraper ou passer */
    const isoUTC = d => d.toISOString().slice(0, 10);
    const [ty, tm, td] = today().split("-").map(Number);
    const t0 = Date.UTC(ty, tm - 1, td), dow = (new Date(t0).getUTCDay() + 6) % 7; // 0 = lundi
    const mon = isoUTC(new Date(t0 - dow * 864e5)), prevMon = isoUTC(new Date(t0 - (dow + 7) * 864e5));
    await CycleStore.importCycle(makeSampleCycle(prevMon, "cycle-past")); await goto("cf");
    ok("semaine passée non faite → bandeau de décision", !!document.querySelector("[data-decide='skip']"));
    const sunCal = isoUTC(new Date(t0 + (6 - dow) * 864e5));
    ok("team WOD : dimanche de la semaine du calendrier, même en rattrapage",
       document.querySelector(".cf-wod .cf-bdate").textContent.trim() === "dim. " + sunCal.slice(8, 10) + "/" + sunCal.slice(5, 7));
    document.querySelector("[data-decide='skip']").click(); await tick();
    ok("passer → w2s1 en tête", document.querySelector(".cf-next [data-open]").dataset.open === "w2s1");
    await CycleStore.importCycle(makeSampleCycle(mon)); await goto("");
    ok("carte Programmation chez Moss", !!document.querySelector("[data-cf]"));
    await goto("cf");
    ok("semaine : 4 séances", document.querySelectorAll(".cf-sess").length === 4);
    ok("Programmation : titres en casse normale", document.querySelector("h1").textContent.trim() === "Ta semaine");
    ok("Ta semaine : liste sans panneau", getComputedStyle(document.querySelector(".cf-list")).backgroundColor === "rgba(0, 0, 0, 0)");
    ok("w1s1 en tête", document.querySelector(".cf-next [data-open]").dataset.open === "w1s1");
    ok("bonus présent", !!document.querySelector(".cf-bonus"));
    ok("pas de carte micro-programme", !document.querySelector("[data-micro]"));

    /* 9. PROGRAMMATION : séance (charges, RX/INT, score, séance faite) */
    await goto("cf/s/w1s1");
    ok("force : charges vides sans max", document.querySelector(".cf-load").textContent.trim() === "—");
    await CycleStore.saveAthlete(PLCycle.setMax(CycleStore.getAthlete(), "back_squat", 120, today())); await goto("cf"); await goto("cf/s/w1s1");
    ok("force : 72,5 / 85 / 95 kg", [...document.querySelectorAll(".cf-load")].map(e => e.textContent.trim()).join("|") === "72,5 kg|85 kg|95 kg");
    ok("ceinture sur la ligne à 80 %", document.querySelectorAll(".cf-belt").length === 1);
    ok("tapis sur l'échauffement", !!document.querySelector(".cf-flag-tapis"));
    ok("séance de la Programmation : une zone principale <main>", oneMain() && !!document.querySelector("main .cf-blocks"));
    ok("charge lisible à bout de bras (26 px)", parseFloat(getComputedStyle(document.querySelector(".cf-load")).fontSize) >= 26);
    /* 9a. séance en composition Sumi : en-tête, type des blocs à la verticale, série de travail en grand */
    const topOf = sel => document.querySelector(sel).getBoundingClientRect().top;
    ok("séance : retour, titre puis repère, dans cet ordre", topOf(".back") < topOf("h1") && topOf("h1") < topOf(".kicker"));
    ok("séance : le titre est celui de la séance", document.querySelector("h1").textContent.trim() === "Back squat");
    ok("séance : repère semaine, phase et rang", /Semaine 1 · Base · séance 1 sur 4/.test(document.querySelector(".kicker").textContent));
    const vks = [...document.querySelectorAll(".cf-blk .cf-vk")];
    ok("blocs : type écrit à la verticale", vks.length === 4 && vks.every(e => getComputedStyle(e).writingMode === "vertical-rl")
       && vks.map(e => e.textContent).join("|") === "Échauffement|Force|Metcon|Accessoire");
    ok("blocs : le type fait partie du bouton (nom annoncé)", /^Force/.test(document.querySelector('[data-block="1"]').textContent.trim()));
    ok("blocs : titre sans répéter le type", document.querySelector('[data-block="1"] b').textContent.trim() === "Back squat");
    ok("blocs : sans panneau", getComputedStyle(document.querySelector(".cf-blk")).backgroundColor === "rgba(0, 0, 0, 0)");
    const topLoad = document.querySelectorAll(".cf-line.top .cf-load");

    ok("séance faite : bouton désactivé pendant l'envoi", cfd.disabled);

    document.getElementById("cfundo").click(); await tick(100);

    document.getElementById("cfback").click(); await tick();

    ok("fiche : contenu échappé", !document.getElementById("xss") && /<img/.test(document.querySelector("h1").textContent));
    await CycleStore.importCycle(makeSampleCycle(mon));

    /* 9c. PROGRAMMATION : Ton mois */

    ok("mois : détail du jour, lien vers la séance", !!document.querySelector('.cf-dday a[href="#/cf/s/w1s1"]'));
    ok("mois : team WOD le dimanche de la semaine", /T/.test(document.querySelector(`.cf-day[data-day="${sunCal}"]`).textContent));
    const fut = [...document.querySelectorAll(".cf-day[data-day]")].find(b => b.dataset.day > sunCal && !b.disabled && b.dataset.day.slice(0, 7) === today().slice(0, 7));
    if (fut) { fut.click(); await tick(); ok("mois : jour à venir", /À venir|Après la fin du cycle/.test(document.querySelector(".cf-dday").textContent)); }
    const b9 = PLCycle.monthBounds(CycleStore.getCycles(), today());

    const c0 = makeSampleCycle(old0, "cycle-0"); c0.title = "Cycle 0";
    await CycleStore.importCycle(c0); await CycleStore.importCycle(makeSampleCycle(mon));
    const a0 = CycleStore.getAthlete(); a0.logs["cycle-0"] = PLCycle.newLog();
    PLCycle.markDone(a0.logs["cycle-0"], "w1s1", old0d);
    PLCycle.recordScore(a0.logs["cycle-0"], "w1s1", "rx", PLCycle.parseScore("rounds_reps", "7+3"), old0d, "amrap-a");
    await CycleStore.saveAthlete(a0);
    const monthsBack = iso => { const [y, m] = iso.split("-").map(Number); return (ty * 12 + tm) - (y * 12 + m); };
    const openDay = async iso => {
      await goto("cf"); await goto("cf/mois");
      for (let i = monthsBack(iso); i > 0; i--) { document.getElementById("cfprev").click(); await tick(); }
      document.querySelector(`.cf-day[data-day="${iso}"]`).click(); await tick();
    };
    await openDay(old0d);
    ok("mois : séance d'un ancien cycle", [...document.querySelectorAll(`.cf-day[data-day="${old0d}"] .cf-chip.c-session`)].map(e => e.textContent).join(",") === "S1");
    const dd0 = document.querySelector(".cf-dday").textContent;
    ok("mois : ancien cycle nommé, avec son score", /Cycle 0 · Semaine 1/.test(dd0) && /7 tours \+ 3/.test(dd0));
    const lab0 = document.querySelector(".cf-mlabel").textContent;
    const rev0 = document.querySelector('.cf-dday a[href="#/cf/s/cycle-0/w1s1"]');
    ok("mois : lien vers la séance de l'ancien cycle", !!rev0);
    if (rev0) {
      rev0.click(); await tick();
      ok("séance d'un ancien cycle : ouverte, son score", location.hash === "#/cf/s/cycle-0/w1s1"
         && /Cycle 0/.test(document.querySelector(".cf").textContent) && /Enregistré : 7 tours \+ 3/.test(document.querySelector(".cf").textContent));
      document.getElementById("cfback").click(); await tick();
      ok("séance d'un ancien cycle : retour au même mois", location.hash === "#/cf/mois" && document.querySelector(".cf-mlabel").textContent === lab0);
    }
    await openDay(gap0);
    ok("mois : jour entre deux cycles", /Entre deux cycles\./.test(document.querySelector(".cf-dday").textContent));
    await goto("cf"); await goto("cf/mois");
    ok("mois : cycle actif sans nom de cycle", !/Cycle test ·/.test(document.querySelector(".cf-dday").textContent));

    /* 9d. PROGRAMMATION : Ton programme */
    await goto("cf");
    ok("pied de page : Ton programme", !!document.querySelector('.cf-foot a[href="#/cf/programme"]'));
    await goto("cf/programme");
    ok("programme : objectifs du cycle", document.querySelectorAll(".cf-goal").length === 2);
    ok("programme : 2 semaines", document.querySelectorAll("[data-week]").length === 2);
    ok("programme : semaine en cours choisie", document.querySelector('[data-week][aria-pressed="true"]').dataset.week === "0");
    ok("programme : charge calculée", /Back squat · 4 × 3 à 80 % · 95 kg/.test(document.querySelector('[data-psess="w1s1"]').textContent));
    ok("programme : séance faite", /faite/.test(document.querySelector('[data-psess="w1s1"]').textContent));
    document.querySelector('[data-week="1"]').click(); await tick();
    ok("programme : semaine 2", /Semaine 2/.test(document.querySelector(".cf").textContent) && !!document.querySelector('[data-psess="w2s1"]'));
    document.querySelector('[data-psess="w2s1"]').click(); await tick();
    ok("programme : séance ouvrable", location.hash === "#/cf/s/w2s1");
    await goto("cf/programme");
    ok("programme : lien vers les fiches", !!document.querySelector('a[href="#/cf/m"]'));
    const bare = makeSampleCycle(mon); delete bare.goals; delete bare.movements;
    bare.weeks.forEach(w => [...w.sessions, w.bonus].forEach(s => s.blocks.forEach(b => delete b.moves)));
    await CycleStore.importCycle(bare); await goto("cf"); await goto("cf/programme");
    ok("programme sans objectifs ni fiches", !document.querySelector(".cf-goal") && !document.querySelector('a[href="#/cf/m"]'));
    await goto("cf/s/w1s1");
    ok("séance sans fiches : pas de rangée", !document.querySelector(".cf-moves"));
    await CycleStore.importCycle(makeSampleCycle(mon));

    /* 9e. PROGRAMMATION : bandeau de 9 semaines, retours vers l'écran d'origine */
    const nine = makeSampleCycle(mon);
    for (let n = 3; n <= 9; n++) {
      const w = JSON.parse(JSON.stringify(nine.weeks[(n - 1) % 2])); w.n = n;
      w.sessions.forEach((s, i) => s.id = `w${n}s${i + 1}`); w.bonus.id = `w${n}b`; nine.weeks.push(w);
    }
    nine.weeks[8].phase = "test";
    await CycleStore.importCycle(nine); await goto("cf");
    const appEl = document.getElementById("app"); appEl.style.width = "320px";   // largeur d'iPhone : le bandeau déborde
    await goto("cf/programme");
    document.querySelector('[data-week="8"]').click(); await tick();
    const strip9 = document.querySelector(".cf-strip").getBoundingClientRect(), sel9 = document.querySelector('[data-week="8"]').getBoundingClientRect();
    ok("programme : semaine choisie visible dans le bandeau", sel9.left >= strip9.left - 1 && sel9.right <= strip9.right + 1);
    appEl.style.width = "";
    document.querySelector('[data-week="1"]').click(); await tick();
    document.querySelector('[data-psess="w2s1"]').click(); await tick();
    document.getElementById("cfback").click(); await tick();
    ok("séance ouverte depuis le programme : retour au programme, même semaine",
       location.hash === "#/cf/programme" && document.querySelector('[data-week="1"]').getAttribute("aria-pressed") === "true");
    await goto("cf/mois");
    document.querySelector('.cf-dday a[href="#/cf/s/w1s1"]').click(); await tick();
    document.getElementById("cfback").click(); await tick();
    ok("séance ouverte depuis le mois : retour au mois", location.hash === "#/cf/mois");
    await goto("cf/s/w1s1");
    document.querySelector('[data-level="rx"]').click(); await tick();
    document.getElementById("cfscore").value = "9+1";
    document.querySelector('.cf-moves a[href="#/cf/m/wall_ball"]').click(); await tick();
    document.getElementById("cfback").click(); await tick();
    ok("retour de fiche : séance conservée (niveau, saisie)",
       location.hash === "#/cf/s/w1s1" && !!document.querySelector('.cf-level[data-open-level="rx"]') && document.getElementById("cfscore").value === "9+1");
    await CycleStore.importCycle(makeSampleCycle(mon));

    /* 9f. tout est ouvert : séance d'une semaine à venir, cycle pas encore commencé */
    await goto("cf/s/w2s1");
    ok("semaine à venir : séance faisable (bouton, score)", !!document.getElementById("cfdone") && !document.getElementById("cfdone").disabled && !!document.getElementById("cfscore"));
    const nextMon = isoUTC(new Date(Date.parse(mon) + 7 * 864e5));
    await CycleStore.importCycle(makeSampleCycle(nextMon, "cycle-1")); await goto("cf/m"); await goto("cf");
    ok("avant le départ : bandeau, tout est ouvert", /démarre le/.test(document.querySelector(".cf-note").textContent) && /déjà ouvert/.test(document.querySelector(".cf-note").textContent));
    ok("avant le départ : prochaine séance proposée", !!document.querySelector(".cf-next [data-open]"));
    await CycleStore.importCycle(makeSampleCycle(mon));

    /* 9g. coche par bloc : swipe sur l'en-tête (droite = coché, gauche = effacé), le score coche le metcon */
    const swipe = async (i, dx, dy = 0) => {
      const h = document.querySelector(`[data-swipe="${i}"]`), r = h.getBoundingClientRect(), x = r.left + 40, y = r.top + 10;
      const P = (type, k) => h.dispatchEvent(new PointerEvent(type, { bubbles: true, pointerId: 5, button: 0, clientX: x + dx * k, clientY: y + dy * k }));
      P("pointerdown", 0); for(let k = 1; k <= 8; k++) P("pointermove", k / 8);
      P("pointerup", 1); if(!dy) h.click(); await tick(400);
    };
    const bl = sid => CycleStore.getAthlete().logs["cycle-1"].blocks[sid] || {};
    ok("bloc : le score enregistré a coché le metcon", !!bl("w1s1")[2]);
    await goto("cf/s/w2s1");
    ok("bloc : consigne du swipe tant que rien n'est coché", /Glisse un bloc/.test(document.querySelector(".cf-bprog").textContent));
    document.querySelector('[data-block="1"]').click(); await tick();
    ok("bloc : force repliée avant le test", document.querySelector('[data-block="1"]').getAttribute("aria-expanded") === "false");
    await swipe(0, 40);
    ok("bloc : swipe court = rien coché, rien déplié", !bl("w2s1")[0] && document.querySelector('[data-block="0"]').getAttribute("aria-expanded") === "false");
    await swipe(0, 6, 80);
    ok("bloc : geste vertical = rien coché", !bl("w2s1")[0]);
    await swipe(0, 220);
    ok("bloc : swipe long = échauffement coché", !!bl("w2s1")[0] && document.querySelectorAll(".cf-blk")[0].classList.contains("done"));
    ok("bloc : heure de la coche affichée", /fait à \d\dh\d\d/.test(document.querySelectorAll(".cf-blk")[0].textContent));
    ok("bloc : le suivant (force) s'ouvre", document.querySelector('[data-block="1"]').getAttribute("aria-expanded") === "true");
    ok("bloc : progression 1 sur 3", /1 sur 3/.test(document.querySelector(".cf-bprog").textContent));
    await swipe(0, -220);
    ok("bloc : swipe vers la gauche = effacé", !bl("w2s1")[0] && !document.querySelectorAll(".cf-blk")[0].classList.contains("done"));
    await swipe(0, 220); await swipe(1, 220); await swipe(2, 220);
    ok("bloc : tous les obligatoires cochés → valider la séance", /valide la séance/.test(document.querySelector(".cf-bprog").textContent));

    PLCycle.recordScore(ls, "w2s1", "int", { value: 6000, text: "6 tours" }, today(), "amrap-a"); await CycleStore.saveAthlete(as);
    await goto("cf/stats");
    const stx = PLCycle.cycleStats(CycleStore.getCycle(), CycleStore.getAthlete().logs["cycle-1"], today());
    ok("stats : séances faites affichées", document.querySelector(".cf-hnum").textContent === String(stx.done) && stx.done > 0);
    ok("stats : une ligne par semaine, 4 séances + bonus", document.querySelectorAll(".cf-gw").length === CycleStore.getCycle().weeks.length
       && document.querySelectorAll(".cf-gw")[0].querySelectorAll(".cf-gc").length === 5);
    ok("stats : w1s1 faite dans la grille", document.querySelector('.cf-grid [data-open="w1s1"]').classList.contains("s-done"));
    ok("stats : benchmark refait comparé", [...document.querySelectorAll(".cf-bm")].some(e => /AMRAP 12 min/.test(e.textContent) && /mieux/.test(e.textContent)));
    ok("stats : force ou invitation à saisir les max", !!document.querySelector(".cf-stats .cf-mkg") || !!document.querySelector('.cf-stats a[href="#/cf/max"]'));
    document.querySelector('.cf-grid [data-open="w1s1"]').click(); await tick(100);
    ok("stats : une case ouvre sa séance, retour vers Tes stats", location.hash === "#/cf/s/w1s1" && /Tes stats/.test(document.getElementById("cfback").textContent));
    await goto("cf/stats");
    ok("stats : rendu propre", !/NaN|undefined/.test(document.getElementById("app").textContent));

    /* 10. PROGRAMMATION : importer un cycle, tes max */
    await goto("cf/import");
    const badCycle = makeSampleCycle(mon, "cycle-bad"); badCycle.schema = "x";
    document.getElementById("cfjson").value = JSON.stringify(badCycle);
    document.getElementById("cfimport").click(); await tick();
    ok("import invalide : message du validateur", document.querySelector(".cf-err").textContent.includes("Schéma attendu"));
    ok("import invalide : cycle inchangé", CycleStore.getCycle().id === "cycle-1");
    const goodCycle = makeSampleCycle(mon); goodCycle.title = "Cycle importé";
    document.getElementById("cfjson").value = JSON.stringify(goodCycle);
    document.getElementById("cfimport").click(); await tick(100);
    ok("import valide via le formulaire", CycleStore.getCycle().title === "Cycle importé" && location.hash === "#/cf");
    ok("journal conservé après réimport", !!CycleStore.getAthlete().logs["cycle-1"].done.w1s1);
    await goto("cf/max");
    document.querySelector('[data-edit="snatch"]').click(); await tick();
    document.getElementById("cfmkg").value = "55"; document.getElementById("cfmsave").click(); await tick(100);
    ok("tes max : snatch 55 kg", document.querySelector('[data-lift="snatch"] .cf-mkg').textContent.trim() === "55 kg");
    ok("tes max : front squat estimé : 102 kg", document.querySelector('[data-lift="front_squat"]').textContent.includes("estimé : 102 kg"));
    const mossExp = Backend.exportAll().profiles.find(p => p.id === "moss");
    ok("export : programmation incluse (max, séances faites)",
       !!mossExp.cycle && mossExp.cycle.maxes.snatch[0].kg === 55 && !!mossExp.cycle.logs["cycle-1"].done.w1s1);

    /* 11. réseau de salle : la synchro du module ne bloque jamais l'affichage */
    const realRefresh = CycleStore.refresh;
    CycleStore.refresh = () => new Promise(() => {});
    const hyd = await Promise.race([hydrate().then(() => "ok"), tick(300).then(() => "bloqué")]);
    ok("hydrate n'attend pas la synchro du module", hyd === "ok");
    CycleStore.refresh = realRefresh;

    /* 12. défauts mineurs de la revue : synchro visible, restauration, champs sans zoom iOS */
    const realCloud = CycleStore.isCloud, realSync = CycleStore.syncState;
    CycleStore.isCloud = () => true; CycleStore.syncState = () => ({ pending: true, error: null });
    await goto("cf/max"); await goto("cf");
    ok("synchro : envoi en attente affiché", ((document.querySelector(".cf-sync") || {}).textContent || "").includes("attente"));
    CycleStore.syncState = () => ({ pending: true, error: "permission denied" });
    await goto("cf/max"); await goto("cf");
    ok("synchro : refus du serveur affiché", ((document.querySelector(".cf-sync") || {}).textContent || "").includes("permission denied"));
    CycleStore.isCloud = realCloud; CycleStore.syncState = realSync;
    let adopted = 0; const realSave = CycleStore.saveAthlete;
    CycleStore.saveAthlete = a => { adopted++; return realSave(a); };
    await goto("add");
    document.getElementById("jsonin").value = JSON.stringify(Backend.exportAll());
    document.getElementById("import").click(); await tick(200);
    ok("restauration d'une sauvegarde : programmation remise en file d'envoi", adopted === 1);
    CycleStore.saveAthlete = realSave;
    await goto("cf/import");
    ok("champ d'import en 16 px (pas de zoom iOS)", getComputedStyle(document.getElementById("cfjson")).fontSize === "16px");
    const probe = document.createElement("div"); probe.className = "cf"; probe.innerHTML = '<div class="authbox"><input id="cfprobe"></div>';
    document.body.appendChild(probe);
    ok("champs de connexion du module en 16 px", getComputedStyle(document.getElementById("cfprobe")).fontSize === "16px");
    probe.remove();
  } catch (e) {
    out.push("E2E-FAIL exception : " + (e && e.stack || e));
  }
  document.getElementById("results").textContent = out.join("\n");
  document.title = out.every(l => l.startsWith("E2E-PASS")) ? "E2E-ALL-PASS" : "E2E-HAS-FAILURES";
})();
